{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0 rounded-3 max-w-lg mx-auto" style="max-width: 600px;">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0 fw-bold"><i class="fas fa-users-cog me-2"></i>Assign Group Program</h4>
    </div>
    <div class="card-body p-4">
      <form method="post" id="assignForm">
        {% csrf_token %}

        <div class="mb-3">
          <label for="category" class="form-label fw-bold">Select Category:</label>
          <select id="category" name="category" class="form-select" required>
            <option value="">-- Select Category --</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="program" class="form-label fw-bold">Select Group Program:</label>
          <select id="program" name="program" class="form-select" required>
            <option value="">-- Select Program --</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="group_name" class="form-label fw-bold">Group Name (Optional):</label>
          <input type="text" id="group_name" name="group_name" class="form-control" placeholder="e.g., Moulid Team 1 or Group A">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold" id="participantsLabel">Select Group Members:</label>
          <div id="participants" class="border rounded p-3 bg-light" style="max-height: 250px; overflow-y: auto;">
            <p class="text-muted mb-0 small">Select category to load contestants.</p>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fas fa-plus-circle me-1"></i>Create & Assign Group</button>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function(){
  var maxMembers = 1;

  $('#category').change(function(){
    var categoryId = $(this).val();
    if(categoryId){
      // Fetch programs
      $.post("{% url 'get_group_programs' %}", {
        'csrfmiddlewaretoken': '{{ csrf_token }}',
        'category_id': categoryId
      }, function(response){
        $('#program').empty().append('<option value="">-- Select Program --</option>');
        response.programs.forEach(function(prog){
          $('#program').append('<option value="'+prog.id+'" data-members="'+prog.members_count+'">'+prog.name+' (Max '+prog.members_count+' members)</option>');
        });
      });

      // Fetch participants
      $.post("{% url 'get_participants_by_category' %}", {
        'csrfmiddlewaretoken': '{{ csrf_token }}',
        'category_id': categoryId
      }, function(response){
        $('#participants').empty();
        if (response.contestants.length === 0) {
          $('#participants').append('<p class="text-muted mb-0 small">No contestants found in this category.</p>');
        }
        response.contestants.forEach(function(cont){
          $('#participants').append(
            '<div class="d-flex align-items-center justify-content-between border-bottom py-1 px-1">'+
              '<div class="form-check mb-0">'+
                '<input type="checkbox" name="participants" value="'+cont.id+'" class="form-check-input participantBox" id="c_'+cont.id+'">'+
                '<label class="form-check-label fw-semibold" for="c_'+cont.id+'">#'+cont.id+' '+cont.name+'</label>'+
              '</div>'+
              '<div class="form-check mb-0 captainRadioWrap" id="cap_wrap_'+cont.id+'" style="display:none;">'+
                '<input type="radio" name="captain" value="'+cont.id+'" class="form-check-input captainRadio" id="cap_'+cont.id+'">'+
                '<label class="form-check-label small text-primary fw-bold cursor-pointer" for="cap_'+cont.id+'">⭐ Captain</label>'+
              '</div>'+
            '</div>'
          );
        });
      });
    }
  });

  $('#program').change(function(){
    var selectedOpt = $(this).find(':selected');
    maxMembers = parseInt(selectedOpt.data('members')) || 1;
    $('#participantsLabel').html('Select Group Members <span class="badge bg-primary text-white ms-1">Up to '+maxMembers+' members allowed (min 1)</span>:');
  });

  // Limit selection count & handle Captain radio visibility
  $(document).on('change', '.participantBox', function(){
    var contId = $(this).val();
    var checkedCount = $('.participantBox:checked').length;

    if(this.checked){
      if(checkedCount > maxMembers){
        alert("You can select at most " + maxMembers + " members for this program.");
        this.checked = false;
        return;
      }
      $('#cap_wrap_' + contId).show();
      // Auto-select first checked as captain if no captain is selected
      if($('.captainRadio:checked').length === 0){
        $('#cap_' + contId).prop('checked', true);
      }
    } else {
      $('#cap_wrap_' + contId).hide();
      $('#cap_' + contId).prop('checked', false);
      // If unchecking the captain, pick next checked contestant as captain
      if($('.captainRadio:checked').length === 0 && checkedCount > 0){
        var firstCheckedId = $('.participantBox:checked').first().val();
        $('#cap_' + firstCheckedId).prop('checked', true);
      }
    }
  });

  // Validate before submit
  $('#assignForm').submit(function(e){
    if ($('#program').val() === "") {
      alert("Please select a group program.");
      e.preventDefault();
      return;
    }
    var checkedCount = $('.participantBox:checked').length;
    if (checkedCount < 1) {
      alert("Please select at least 1 participant for this group.");
      e.preventDefault();
    } else if (checkedCount > maxMembers) {
      alert("You can select at most " + maxMembers + " participants for this group.");
      e.preventDefault();
    }
  });
});
</script>
{% endblock %}
